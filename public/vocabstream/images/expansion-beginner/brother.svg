<svg xmlns="http://www.w3.org/2000/svg" width="320" height="240" viewBox="0 0 320 240" role="img"><title>基準となる人を示し、兄、弟、兄弟に当たる家族の位置を強調した関係図。</title><rect x="0" y="0" width="320" height="240" rx="22" fill="#eef5f3"/><text x="160" y="25" text-anchor="middle" font-family="Arial, Hiragino Sans, sans-serif" font-size="17" font-weight="500" fill="#35535c">家族の関係</text><rect x="125" y="41" width="70" height="35" rx="6" fill="white" stroke="#35535c" stroke-width="3"/><text x="160" y="65" text-anchor="middle" font-family="Arial, Hiragino Sans, sans-serif" font-size="13" font-weight="500" fill="#35535c">共通の親</text><line x1="160" y1="76" x2="160" y2="105" stroke="#35535c" stroke-width="3" stroke-linecap="round"/><line x1="62" y1="105" x2="258" y2="105" stroke="#35535c" stroke-width="3" stroke-linecap="round"/><line x1="62" y1="105" x2="62" y2="141" stroke="#35535c" stroke-width="3" stroke-linecap="round"/><rect x="29" y="141" width="66" height="43" rx="6" fill="#e79d7c" stroke="#35535c" stroke-width="3"/><text x="62" y="168" text-anchor="middle" font-family="Arial, Hiragino Sans, sans-serif" font-size="13" font-weight="500" fill="#35535c">男の子</text><line x1="160" y1="105" x2="160" y2="141" stroke="#35535c" stroke-width="3" stroke-linecap="round"/><rect x="127" y="141" width="66" height="43" rx="6" fill="#6fa7a3" stroke="#35535c" stroke-width="3"/><text x="160" y="168" text-anchor="middle" font-family="Arial, Hiragino Sans, sans-serif" font-size="13" font-weight="500" fill="white">あなた</text><line x1="258" y1="105" x2="258" y2="141" stroke="#35535c" stroke-width="3" stroke-linecap="round"/><rect x="225" y="141" width="66" height="43" rx="6" fill="white" stroke="#35535c" stroke-width="3"/><text x="258" y="168" text-anchor="middle" font-family="Arial, Hiragino Sans, sans-serif" font-size="13" font-weight="500" fill="#35535c">女の子</text></svg>
