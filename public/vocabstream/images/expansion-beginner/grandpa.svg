<svg xmlns="http://www.w3.org/2000/svg" width="320" height="240" viewBox="0 0 320 240" role="img"><title>基準となる人を示し、おじいちゃんに当たる家族の位置を強調した関係図。</title><rect x="0" y="0" width="320" height="240" rx="22" fill="#eef5f3"/><text x="160" y="25" text-anchor="middle" font-family="Arial, Hiragino Sans, sans-serif" font-size="17" font-weight="500" fill="#35535c">家族の関係</text><line x1="82" y1="72" x2="238" y2="72" stroke="#35535c" stroke-width="3" stroke-linecap="round"/><line x1="160" y1="72" x2="160" y2="124" stroke="#35535c" stroke-width="3" stroke-linecap="round"/><line x1="160" y1="142" x2="160" y2="183" stroke="#35535c" stroke-width="3" stroke-linecap="round"/><rect x="49" y="37" width="66" height="36" rx="6" fill="white" stroke="#35535c" stroke-width="3"/><text x="82" y="62" text-anchor="middle" font-family="Arial, Hiragino Sans, sans-serif" font-size="15" font-weight="500" fill="#35535c">祖母</text><rect x="205" y="37" width="66" height="36" rx="6" fill="#e79d7c" stroke="#35535c" stroke-width="3"/><text x="238" y="62" text-anchor="middle" font-family="Arial, Hiragino Sans, sans-serif" font-size="15" font-weight="500" fill="#35535c">祖父</text><rect x="124" y="108" width="72" height="36" rx="6" fill="white" stroke="#35535c" stroke-width="3"/><text x="160" y="132" text-anchor="middle" font-family="Arial, Hiragino Sans, sans-serif" font-size="15" font-weight="500" fill="#35535c">親</text><rect x="120" y="179" width="80" height="36" rx="6" fill="#6fa7a3" stroke="#35535c" stroke-width="3"/><text x="160" y="203" text-anchor="middle" font-family="Arial, Hiragino Sans, sans-serif" font-size="14" font-weight="500" fill="white">あなた</text></svg>
