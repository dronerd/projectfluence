<svg xmlns="http://www.w3.org/2000/svg" width="360" height="240" viewBox="0 0 360 240">
<title>土を入れ、種をまき、水をやる三つの作業を順番に並べた図。</title>
<metadata>Original ProjectFluence teaching diagram. CC0-1.0. https://creativecommons.org/publicdomain/zero/1.0/</metadata>
<rect width="360" height="240" rx="20" fill="#f5f8f6"/>
<rect x="25" y="78" width="92" height="40" rx="5" fill="#d9b76c" stroke="#40565b" stroke-width="2.5"/><text x="71.0" y="104" text-anchor="middle" font-size="15" fill="#40565b" font-family="system-ui,-apple-system,sans-serif">①土を入れる</text><line x1="124" y1="100" x2="143" y2="100" stroke="#40565b" stroke-width="3" stroke-linecap="round"/><polygon points="143,100 133.0,95.0 133.0,105.0" fill="#40565b"/><rect x="151" y="78" width="88" height="40" rx="5" fill="#89b28c" stroke="#40565b" stroke-width="2.5"/><text x="195.0" y="104" text-anchor="middle" font-size="15" fill="#40565b" font-family="system-ui,-apple-system,sans-serif">②種をまく</text><line x1="246" y1="100" x2="265" y2="100" stroke="#40565b" stroke-width="3" stroke-linecap="round"/><polygon points="265,100 255.0,95.0 255.0,105.0" fill="#40565b"/><rect x="272" y="78" width="70" height="40" rx="5" fill="#77aebc" stroke="#40565b" stroke-width="2.5"/><text x="307.0" y="104" text-anchor="middle" font-size="15" fill="#40565b" font-family="system-ui,-apple-system,sans-serif">③水をやる</text><text x="180" y="178" text-anchor="middle" font-size="24" fill="#40565b" font-family="system-ui,-apple-system,sans-serif">① → ② → ③</text><text x="180" y="213" text-anchor="middle" font-size="18" fill="#40565b" font-family="system-ui,-apple-system,sans-serif">決まった順番</text>
</svg>
